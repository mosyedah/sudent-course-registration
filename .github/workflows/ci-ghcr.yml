# .github/workflows/ci-ghcr.yml
name: CI → Test → Build & Push (GHCR)

# allow this workflow to push packages (GHCR) using GITHUB_TOKEN
permissions:
  contents: read
  packages: write

# run on pushes to master (change branch if needed)
on:
  push:
    branches: [ "master" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    # Run DynamoDB Local as a service container that the runner can reach at localhost:8000
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -fs http://localhost:8000 >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # change these if your main classes are in different packages/names
      TABLE_INIT_MAIN: enrollment.courseenrollment.repository.dynamodb.TableInitialiser
      TABLE_POPULATOR_MAIN: enrollment.courseenrollment.repository.dynamodb.TablePopulator
      # image naming; ghcr uses ghcr.io/OWNER/REPO
      IMAGE_SHA: ghcr.io/${{ github.repository }}:${{ github.sha }}
      IMAGE_LATEST: ghcr.io/${{ github.repository }}:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Wait for DynamoDB Local to be ready
        run: |
          echo "Waiting for DynamoDB Local on localhost:8000..."
          for i in {1..30}; do
            curl -s http://localhost:8000 >/dev/null 2>&1 && { echo "DynamoDB Local ready"; break; }
            echo "waiting for dynamodb... ($i/30)"
            sleep 1
          done

      # Build the project but skip tests for the packaging step.
      - name: Build (package, skip tests)
        run: mvn -B -DskipTests clean package

      # Run the initializer and populator mains (they will check existence before creating)
      - name: Initialize DynamoDB tables (TableInitialiser)
        run: mvn exec:java -Dexec.mainClass="${{ env.TABLE_INIT_MAIN }}"

      - name: Populate DynamoDB tables (TablePopulator)
        run: mvn exec:java -Dexec.mainClass="${{ env.TABLE_POPULATOR_MAIN }}"

      # Run the tests (this will fail the job if tests fail; no image build will occur)
      - name: Run tests
        run: mvn -B test

      # If we reached here, tests passed — authenticate to GHCR and push the image
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (push sha + latest)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_LATEST }}
          build-args: |
            # optionally pass build args
            # e.g. AWS_DYNAMODB_ENDPOINT=http://localhost:8000
